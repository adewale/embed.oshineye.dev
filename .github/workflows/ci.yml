name: CI

# Fast gate for every change: TypeScript typecheck, the Vitest route and
# header-contract suite, and the Python crawler tests (`npm run check`).
# These embeds are served inside third-party pages, so a broken header or
# route should fail here rather than in someone else's blog post.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, vitest, python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # `npm ci` also runs patch-package (postinstall), which the typecheck
      # relies on: the patched beautiful-mermaid RenderOptions has `thoroughness`.
      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  # Browser tests against a local `wrangler dev` (started by playwright.config.ts).
  # Screenshot tests are excluded until Linux baselines are committed via the
  # manual "Regenerate visual baselines" workflow; --update-snapshots=none stops
  # a missing baseline from being written and then passing against itself.
  e2e:
    name: playwright (no screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test --grep-invert screenshot --update-snapshots=none
