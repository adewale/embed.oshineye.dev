name: Regenerate visual baselines

# Screenshot baselines are specific to the OS, fonts and browser build that
# rendered them. Only macOS baselines (*-chromium-darwin.png) are committed, so
# the seven screenshot tests fail on Linux with "A snapshot doesn't exist".
# This workflow renders *-chromium-linux.png baselines on the GitHub-hosted
# runner image and uploads them as an artifact for a human to review and
# commit.
#
# It never runs automatically and never commits: a baseline that updates itself
# absorbs real regressions into the expected output. Run it when a screenshot
# test has no Linux baseline yet, or after an intentional visual change.
#
# The same run executes every Playwright test against a local `wrangler dev`
# (started by playwright.config.ts), so it fails, and uploads nothing, if a
# non-visual E2E assertion fails.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Render Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E and write Linux baselines
        run: npx playwright test --update-snapshots=all

      - name: Upload Linux baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: tests/e2e/**/*-chromium-linux.png
          if-no-files-found: error
          retention-days: 14
